name: QA
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: System tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf
      - name: Python deps + Chromium
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Self-check
        run: make check
      - name: Layout + touch QA (templates and example)
        run: make qa
      - name: PDFs are fully vector
        run: make pdf-verify
