<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sawab’s Workout Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday, an Apple Fitness companion: calm, confident, short
   IDEA the activity rings: steps, strength and mobility close as you use the page
   PICTURE today's three rings, large, driven by the step counter, set log and stretch player
   COLOUR night black or Apple light grey; lime/green strength, cyan steps, pink mobility
   TYPE Google Sans (English) and IBM Plex Sans Arabic (Sorani), bold display weights, tight tracking
   LAYOUT laptop: title and stats left, today card right; phone: title, rings, stats, then sections */
:root{color-scheme:light dark;
--bg:light-dark(#F5F5F7,#000);--bg2:light-dark(#FFFFFF,#0B0B0D);--ink:light-dark(#1D1D1F,#FFFFFF);--ink2:light-dark(#48484A,#B4B4BA);--ink3:light-dark(#6E6E73,#8E8E93);
--card:light-dark(#FFFFFF,#151518);--card2:light-dark(#FFFFFF,#0E0E10);--rim:light-dark(rgba(0,0,0,.07),rgba(255,255,255,.12));--sep:light-dark(rgba(0,0,0,.08),rgba(255,255,255,.1));
--shc:light-dark(rgba(0,0,0,.05),transparent);--shc2:light-dark(rgba(0,0,0,.07),transparent);
--green:light-dark(#34C759,#A6FF00);--green2:light-dark(#6FDD8B,#D2FF5C);--greenT:light-dark(#1A8A3A,#B4FF2E);--trackG:light-dark(#DDF5E3,#26390A);
--cyan:light-dark(#32ADE6,#00D8FE);--cyan2:light-dark(#7FD4F5,#7BF3FF);--cyanT:light-dark(#0071A4,#5BDCFF);--trackC:light-dark(#DDF1FA,#06323A);
--red:light-dark(#FF2D55,#FA114F);--red2:light-dark(#FF6B88,#FF6A97);--redT:light-dark(#D70F45,#FF4D7A);--trackR:light-dark(#FFE1E8,#3A0814);
--amber:light-dark(#FF9500,#FF9F0A);--amberT:light-dark(#B35900,#FFB547);
--chipG:light-dark(#E6F7EA,#D2FF5C);--chipGt:light-dark(#17803A,#0A0A0A);--chipR:light-dark(#FFEAEF,#FF6A97);--chipRt:light-dark(#C8103F,#0A0A0A);
--chipC:light-dark(#E4F4FC,#7BF3FF);--chipCt:light-dark(#006C9C,#0A0A0A);
--tA:light-dark(#F8F8FA,#2C2C32);--tB:light-dark(#ECECF0,#17171B);--eA:light-dark(#F2FAF4,#2C2C32);--eB:light-dark(#E2F3E6,#17171B);--sA:light-dark(#FFF4F6,#2C2C32);--sB:light-dark(#FFE3E9,#17171B);
--amber2:light-dark(#FFC048,#FFD06B);--cA:light-dark(#FFFFFF,#1A1A1E);--cB:light-dark(#FFFFFF,#0F0F11);
--ic-fg:var(--ink);--ic-ghost:light-dark(#C3C8CE,#4C4C52);--ic-mut:light-dark(#CDD1D6,#3F3F45);--ic-acc:light-dark(#20A84A,#A6FF00);--ic-acc2:light-dark(#F2224F,#FA114F);--ic-ko:light-dark(#EAF7ED,#222227);
--heroA:light-dark(#22B04F,#A6FF00);--heroB:light-dark(#0A8FD0,#00D8FE);
--focus:light-dark(#0071E3,#5BDCFF);--r:22px;--max:1180px;
--font:"Google Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
:root[lang=ckb]{--font:"IBM Plex Sans Arabic","Google Sans",system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:76px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,a,input,select,label,.dot{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);overflow-x:clip;-webkit-font-smoothing:antialiased}
:root[lang=ckb] body{line-height:1.75}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
a{color:var(--cyanT)}
img,svg{max-width:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:10px}
.skip{position:absolute;inset-inline-start:12px;top:-60px;z-index:99;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;text-decoration:none}
.skip:focus{top:10px}
.wrap{max-width:var(--max);margin:0 auto;padding-inline:max(16px,4vw,env(safe-area-inset-left,0px))}
.band{padding-block:clamp(36px,5vw,72px)}
.band+.band{border-top:1px solid var(--sep)}
h1,h2,h3{margin:0;letter-spacing:-.022em;line-height:1.05;text-wrap:balance}
:root[lang=ckb] h1,:root[lang=ckb] h2,:root[lang=ckb] h3{letter-spacing:0;line-height:1.3}
h2{font-size:clamp(32px,4.4vw,48px);font-weight:700}
h3{font-size:19px;font-weight:700;line-height:1.25}
p{margin:0}
.lede{color:var(--ink2);font-size:17px;max-width:62ch;margin-top:14px}
.mut{color:var(--ink3)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:28px}
.card{background:linear-gradient(180deg,var(--cA),var(--cB));border:1px solid var(--rim);border-radius:var(--r);box-shadow:0 1px 2px var(--shc),0 10px 30px var(--shc2);padding:20px}
.grid{display:grid;gap:14px}
.g2,.g2k{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:900px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.g3,.g2{grid-template-columns:minmax(0,1fr)}}
.lab{font-size:13px;font-weight:700;color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:3px 12px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;background:var(--card);border:1px solid var(--rim)}
.chip.g{background:var(--chipG);color:var(--chipGt);border-color:transparent}.chip.r{background:var(--chipR);color:var(--chipRt);border-color:transparent}.chip.c{background:var(--chipC);color:var(--chipCt);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:999px;border:1px solid var(--rim);background:var(--card);font-weight:650;cursor:pointer;text-decoration:none;color:var(--ink);transition:transform .12s,background .2s}
.btn:hover{background:color-mix(in srgb,var(--card) 88%,var(--ink))}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.pri:hover{background:color-mix(in srgb,var(--ink) 85%,var(--bg))}
.btn.ic{width:44px;padding:0}
.btn svg{width:20px;height:20px;flex:none}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.ext::after{content:"↗";display:inline-block;margin-inline-start:3px;font-size:.9em}
:root[dir=rtl] .ext::after{content:"↖"}
.tone-red{color:var(--redT)}.tone-green{color:var(--greenT)}.tone-cyan{color:var(--cyanT)}.tone-ink{color:var(--ink)}.tone-amber{color:var(--amberT)}
input[type=number],input[type=date],input[type=text]{font-size:16px;min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid light-dark(rgba(0,0,0,.18),rgba(255,255,255,.22));background:var(--bg2);width:100%}
input[type=range]{width:100%;accent-color:var(--green);min-height:44px}
label.f{display:grid;gap:6px;font-size:14px;font-weight:600;color:var(--ink2)}
.unit{display:flex;align-items:center;gap:8px}.unit span{font-size:14px;color:var(--ink3);white-space:nowrap}
/* nav */
.nav{position:sticky;top:0;z-index:40;background:light-dark(rgba(245,245,247,.82),rgba(0,0,0,.72));backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--sep)}
.nav .wrap{display:flex;align-items:center;gap:10px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;text-decoration:none;color:var(--ink);white-space:nowrap;margin-inline-end:auto}
.brand svg{width:30px;height:30px}
.links{display:none;gap:2px}
.links a{padding:8px 11px;border-radius:999px;text-decoration:none;color:var(--ink2);font-size:14.5px;font-weight:600;white-space:nowrap}
.links a:hover{color:var(--ink);background:var(--sep)}
.links a[aria-current=true]{color:var(--ink);background:var(--sep)}
.acts{display:flex;gap:6px;align-items:center}
.gh{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 12px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;text-decoration:none}
.gh svg{width:20px;height:20px}
.gh span{display:none}
.lang{font-weight:700;padding:0 14px}
#menuBtn{display:inline-flex}
.menu{display:none;border-top:1px solid var(--sep)}
.menu.open{display:block}
.menu .wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding-block:12px}
.menu a{display:flex;align-items:center;min-height:48px;padding:0 14px;border-radius:14px;text-decoration:none;color:var(--ink);font-weight:650;background:var(--card);border:1px solid var(--rim)}
@media(min-width:640px){.gh span{display:inline}}
/* ---------- motion & light: pointer-tracked rim shine, lift, scroll reveals ---------- */
:root{--shine:light-dark(rgba(0,113,227,.55),rgba(255,255,255,.95));--shineT:light-dark(rgba(52,199,89,.35),rgba(0,216,254,.45));--glow:light-dark(rgba(0,113,227,.06),rgba(255,255,255,.07));--ease:cubic-bezier(.2,.8,.2,1)}
.card{position:relative;isolation:isolate;transition:transform .6s var(--ease),box-shadow .6s var(--ease),border-color .4s}
.card::before,.card::after{content:"";position:absolute;pointer-events:none;border-radius:inherit;opacity:0;transition:opacity .45s var(--ease)}
.card::before{inset:-1px;padding:1.5px;z-index:2;
 background:radial-gradient(300px circle at var(--mx,50%) var(--my,0%),var(--shine),var(--shineT) 35%,transparent 70%);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.card::after{inset:0;z-index:-1;background:radial-gradient(520px circle at var(--mx,50%) var(--my,0%),var(--glow),transparent 55%)}
.card.lit::before,.card.lit::after{opacity:1}
@media (hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference){
 .card.lit{box-shadow:0 2px 4px var(--shc),0 22px 50px light-dark(rgba(0,0,0,.10),rgba(0,0,0,.6))}
 .card.tilt.lit{transform:perspective(1100px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-3px)}
}
.btn,.chip,.dot,.step{transition:transform .25s var(--ease),background .25s,box-shadow .25s}
@media (hover:hover) and (pointer:fine){.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.96)}}
/* scroll reveals (only added by script, so nothing hides without JS) */
@media (prefers-reduced-motion:no-preference){
 .rv{opacity:0;transform:translateY(22px) scale(.985);filter:blur(6px);transition:opacity .9s var(--ease),transform .9s var(--ease),filter .9s var(--ease);transition-delay:var(--d,0ms)}
 .rv.in{opacity:1;transform:none;filter:none}
 .rv.now{transition:none}
 .card.rv.in{transition:opacity .9s var(--ease) var(--d,0ms),transform .6s var(--ease),filter .9s var(--ease) var(--d,0ms),box-shadow .6s var(--ease),border-color .4s}
}
@media print{.rv{opacity:1!important;transform:none!important;filter:none!important}}
/* nav: hairline + progress once the page moves */
.nav{transition:box-shadow .4s,background .4s}
.nav.scrolled{box-shadow:0 1px 0 var(--sep),0 8px 24px light-dark(rgba(0,0,0,.06),rgba(0,0,0,.5))}
.prog{position:absolute;inset-inline:0;bottom:-1px;height:2px;transform-origin:var(--po,left);transform:scaleX(var(--p,0));background:linear-gradient(90deg,var(--heroA),var(--heroB));opacity:.9;pointer-events:none}
:root[dir=rtl] .prog{--po:right;background:linear-gradient(270deg,var(--heroA),var(--heroB))}
.hero>div:first-child{will-change:transform,opacity}
@media (hover:none){.card.lit{transform:scale(.992);transition:transform .25s var(--ease)}.btn:active,.step:active,.chip:active{transform:scale(.95)}}
.toast{top:calc(64px + env(safe-area-inset-top,0px))}
/* compact phone nav: lighter, smaller, evenly spaced controls */
@media(max-width:639px){
 .nav .wrap{min-height:56px;gap:6px}
 .brand{font-size:16px;gap:8px}
 .brand svg{width:24px;height:24px}
 .acts{gap:2px}
 .acts .btn.ic,.acts .gh{width:40px;min-height:40px;height:40px;padding:0;justify-content:center;border:0;background:transparent;color:var(--ink2);border-radius:12px}
 .acts .btn.ic svg,.acts .gh svg{width:20px;height:20px}
 .acts .btn.ic:hover,.acts .gh:hover,.acts .btn.ic:active,.acts .gh:active{background:var(--sep);color:var(--ink)}
 .acts .btn.ic[aria-expanded=true]{background:var(--sep);color:var(--ink)}
 .acts .lang{min-height:32px;height:32px;padding:0 12px;margin-inline-end:4px;font-size:13px;border:0;background:var(--sep);color:var(--ink)}
}
@media(max-width:360px){.brand{font-size:15px}.acts .btn.ic,.acts .gh{width:38px}}
@media(max-width:340px){.brand{font-size:14px;gap:6px}.acts .lang{padding:0 9px;margin-inline-end:2px}.brand .bn{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}
@media(min-width:1180px){.links{display:flex}#menuBtn{display:none}.menu{display:none!important}}
/* hero */
.hero{display:grid;gap:28px;align-items:center}
@media(min-width:900px){.hero{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:44px}}
.kick{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:14px;font-weight:700}
.kick b{color:var(--greenT)}.kick span{color:var(--ink3);font-weight:600}
h1{font-size:clamp(42px,6.2vw,76px);font-weight:700;letter-spacing:-.035em;line-height:1;margin-top:16px}
:root[lang=ckb] h1{letter-spacing:0;line-height:1.3;font-size:clamp(38px,5.6vw,66px)}
h1 .grad{background:linear-gradient(90deg,var(--heroA),var(--heroB));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;padding-bottom:.06em}
:root[dir=rtl] h1 .grad{background:linear-gradient(270deg,var(--heroA),var(--heroB));-webkit-background-clip:text;background-clip:text}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:26px}
.stat{padding:14px 14px 12px}
.stat .v{font-size:clamp(24px,3vw,32px);font-weight:700;letter-spacing:-.03em;line-height:1.15;white-space:nowrap;margin-top:4px}
.stat .s{font-size:13px;color:var(--ink2);margin-top:2px}

.today{padding:22px}
.today .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.today .top b{font-size:20px}
.today .top span{font-size:14px;color:var(--ink3);font-weight:600}
.rings-box{display:grid;grid-template-columns:minmax(150px,230px) minmax(0,1fr);gap:22px;align-items:center;margin-top:12px}
@media(min-width:900px){.hero{align-items:stretch}.today{display:flex;flex-direction:column}.today .rings-box{flex:1;grid-template-columns:minmax(0,1.3fr) minmax(200px,1fr);gap:24px}.today #bigRings svg{max-width:300px;margin-inline:auto}.today .dnav{margin-top:auto}.today .closed{margin-top:4px}}
.rings-box svg.rings{width:100%;height:auto;display:block}
.rings circle{transition:stroke-dashoffset .9s cubic-bezier(.3,.8,.2,1)}
@media(prefers-reduced-motion:reduce){.rings circle{transition:none}}
.rrow{display:grid;gap:6px;padding:12px 0;border-bottom:1px solid var(--sep)}
.rrow:last-child{border-bottom:0}
.rrow .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rrow .t b{font-size:15px}
.rrow .t span{font-weight:700;font-size:17px;white-space:nowrap}
.rrow .ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rrow .ctl:has(#stepsIn){display:grid;grid-template-columns:44px minmax(0,1fr) 44px;flex-wrap:nowrap}
.rrow .ctl input{width:100%;min-width:0}
.step{width:44px;height:44px;border-radius:12px;border:1px solid var(--rim);background:var(--bg2);font-weight:700;cursor:pointer;font-size:14px}
.closed{margin-top:12px;font-weight:700;color:var(--greenT);min-height:1.5em}
@media(max-width:520px){.rings-box{grid-template-columns:1fr}.rings-box svg.rings{max-width:220px;margin:0 auto}}
/* plan */
.plan{display:grid;gap:18px}
@media(min-width:900px){.plan{grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);align-items:end;column-gap:36px;row-gap:26px}.plan>.rcard{grid-column:1/-1}.plan .sum{margin-top:0!important}}
@media(min-width:760px){.rules{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.rules li{background:light-dark(#F5F5F7,#0E0E10);border:1px solid var(--rim);border-radius:16px;padding:14px 16px;transition:border-color .3s,transform .4s var(--ease)}.rules li:hover{border-color:light-dark(rgba(0,0,0,.14),rgba(255,255,255,.22))}}
@media(min-width:1000px){.rules{grid-template-columns:repeat(3,minmax(0,1fr))}}
.sum{display:flex;gap:18px;align-items:center}
.sum svg{width:92px;height:92px;flex:none}
.sum .big{font-size:clamp(30px,3vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.1}
.sum>div{min-width:0;flex:1}
.sum .when{font-weight:700;color:var(--greenT);font-size:14px;margin-top:6px}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.rules li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;align-items:start;color:var(--ink2)}
.rules li strong{color:var(--ink)}
.chk{width:22px;height:22px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin-top:3px}
.chk svg{width:13px;height:13px;stroke:light-dark(#fff,#000)}
/* numbers */
.calc{display:grid;gap:14px}
@media(min-width:900px){.calc{grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr)}}
.calc .ins{display:grid;gap:14px;align-content:start}
@media(min-width:900px){.calc .ins{display:flex;flex-direction:column;gap:16px}.calc .ins>:last-child{margin-top:auto}}
.paceRow{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:var(--ink2)}
.paceRow b{color:var(--ink);font-size:16px}
.res .big{font-size:clamp(26px,3.4vw,36px);font-weight:700;letter-spacing:-.025em;line-height:1.15}
:root[lang=ckb] .res .big{letter-spacing:0;line-height:1.4}
.res .by{color:var(--ink2);font-weight:600;margin-top:4px}
.badge{display:inline-flex;gap:8px;align-items:center;margin-top:12px;padding:6px 12px;border-radius:12px;font-size:14px;font-weight:650}
.badge.ok{background:var(--chipG);color:var(--chipGt)}.badge.warn{background:light-dark(#FFF2E0,#FFB547);color:light-dark(#A85300,#0A0A0A)}.badge.info{background:var(--chipC);color:var(--chipCt)}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.mini div{background:var(--bg);border-radius:14px;padding:10px 12px}
.mini b{display:block;font-size:clamp(16px,calc(8px + 1vw),20px);font-weight:700;line-height:1.25;text-wrap:balance}
.mini span{font-size:13px;color:var(--ink3)}
@media(max-width:520px){.mini{grid-template-columns:minmax(0,1fr)}}
.fig{position:relative;height:260px;margin-top:16px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;direction:ltr}
.fig text{font-size:12.5px;fill:var(--ink3);font-weight:600;paint-order:stroke;stroke:var(--card);stroke-width:4px}
.err{color:var(--redT);font-weight:650;min-height:1.5em;font-size:14px}
.ncards .v{font-size:30px;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
.ncards .u{font-size:13px;color:var(--ink3);font-weight:600}
.ncards p{color:var(--ink2);font-size:15px;margin-top:12px;padding-top:12px;border-top:1px solid var(--sep)}
.tip{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;align-items:center}
.tile{width:56px;height:56px;border-radius:16px;background:linear-gradient(var(--tA),var(--tB));display:grid;place-items:center;border:1px solid var(--rim)}
.tile svg{width:28px;height:28px}
.gl{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tip p{color:var(--ink2);font-size:15px}
/* workout */
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:16px}
.wk{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--rim);border-radius:999px;padding:3px}
.wk output{min-width:96px;text-align:center;font-weight:700;white-space:nowrap}
.wk button{width:40px;height:40px;border-radius:50%;border:0;background:transparent;cursor:pointer;font-size:20px;font-weight:700;color:var(--ink)}
.wk button:hover{background:var(--sep)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--rim);background:var(--card);cursor:pointer;font-weight:650;font-size:14px}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:transparent}
.prog{flex:1 1 220px;display:grid;gap:6px}
.prog .t{display:flex;justify-content:space-between;font-size:14px;font-weight:650;color:var(--ink2)}
.track{height:10px;border-radius:99px;background:var(--trackG);overflow:hidden}
.track i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--green2),var(--green));transition:width .4s}
:root[dir=rtl] .track i{background:linear-gradient(270deg,var(--green2),var(--green))}
.toggle{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink2);cursor:pointer;min-height:44px}
.toggle input{width:20px;height:20px;accent-color:var(--green)}
.exg{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1000px){.exg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.exg{grid-template-columns:minmax(0,1fr)}}
.ex{display:grid;gap:12px;align-content:start}
.exg .ex{grid-template-rows:auto auto 1fr auto auto}
.ex[hidden]{display:none}
.ex .top{display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;align-items:start}
.pic{width:104px;height:104px;border-radius:24px;background:linear-gradient(var(--eA),var(--eB));border:1px solid var(--rim);padding:6px;--ic-ko:light-dark(#EAF7ED,#222227)}
.pic svg{width:100%;height:100%;display:block}
.pic.st{background:linear-gradient(var(--sA),var(--sB));--ic-ko:light-dark(#FFEBEF,#222227);--ic-acc:var(--ic-acc2)}
.ex .n{font-size:13px;font-weight:700;color:var(--greenT)}
.ex h3{margin:2px 0 8px}
.ex .tg{font-size:14px;color:var(--ink)}
.ex .tg b{color:var(--ink3);font-size:12.5px;margin-inline-end:6px}
.ex .cue{color:var(--ink2);font-size:15px}
.dots{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dot{width:44px;height:44px;border-radius:14px;border:1.5px dashed light-dark(rgba(0,0,0,.25),rgba(255,255,255,.3));background:transparent;cursor:pointer;font-weight:700;font-size:14px;color:var(--ink3);display:grid;place-items:center;transition:background .2s,transform .1s}
.dot[aria-pressed=true]{background:var(--green);border:1.5px solid transparent;color:light-dark(#fff,#000)}
.dot:active{transform:scale(.92)}
.ex .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--sep)}
.ex .foot a{font-weight:650;font-size:14px}
.legend{font-size:14px;color:var(--ink3);margin-top:14px}
/* session */
.tl{display:flex;gap:4px;margin-top:14px}
.tl div{height:14px;border-radius:7px}
.tl-l{display:grid;grid-template-columns:minmax(max-content,5fr) minmax(0,35fr) minmax(max-content,10fr);gap:12px;margin-top:8px;font-size:14px}
.tl-l div:last-child{text-align:end}
.tl-l div b{display:block}
.tl-l div span{color:var(--ink3)}
.wlist{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.wlist label{display:grid;grid-template-columns:auto 64px minmax(0,1fr);gap:10px;align-items:center;min-height:44px;cursor:pointer;color:var(--ink2)}
.wlist input{width:20px;height:20px;accent-color:var(--cyan)}
.wlist .chip{justify-content:center}
.wlist input:checked~span:last-child{text-decoration:line-through;color:var(--ink3)}
.reps{display:flex;gap:6px;margin:14px 0 10px;flex-wrap:wrap}
.reps i{width:14px;height:14px;border-radius:50%;background:var(--trackG)}
.reps i.h{background:var(--green)}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:130px;margin-top:16px}
.bars div{display:grid;align-content:end;justify-items:center;gap:4px;height:100%;font-size:13px;font-weight:700}
.bars i{display:block;width:100%;max-width:30px;border-radius:8px}
.bars span{color:var(--ink3);font-weight:600}
.sets{display:grid;grid-template-columns:minmax(0,1fr) repeat(4,24px);gap:8px;align-items:center;margin-top:10px;font-size:14px;font-weight:650;color:var(--ink2)}
.sets i{height:20px;border-radius:6px;background:var(--trackG)}
.sets i.on{background:linear-gradient(var(--green2),var(--green))}
.sets .cur{color:var(--ink)}
/* recover */
.routine{display:grid;gap:16px;align-items:center;margin-bottom:14px}
@media(min-width:760px){.routine{grid-template-columns:minmax(0,1fr) auto}}
.seg{display:inline-flex;background:var(--bg);border-radius:12px;padding:3px;gap:2px}
.seg button{min-height:38px;padding:0 14px;border-radius:10px;border:0;background:transparent;cursor:pointer;font-weight:700}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rmeta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px;color:var(--ink2);font-size:14px}
.stg{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1000px){.stg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.stg{grid-template-columns:minmax(0,1fr)}}
.st .n{color:var(--redT)}
.st .startHere{margin-top:auto}
.sleep .pic{background:linear-gradient(var(--tA),var(--tB));display:grid;place-items:center}
.sleep .pic svg{width:52px;height:52px}
/* week */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.days button{display:grid;justify-items:center;gap:6px;padding:12px 4px;border-radius:18px;border:1px solid var(--rim);background:var(--card);cursor:pointer;min-height:44px}
.days button b{font-size:14px;white-space:nowrap}
.days button svg{width:min(44px,100%);height:auto}
.days button[aria-selected=true]{outline:2px solid var(--ink);outline-offset:-2px}
.days button .tdy{font-size:11.5px;font-weight:700;color:var(--greenT);min-height:1.2em}
:root[lang=ckb] .days button b{font-size:12px}
.daydet{display:grid;gap:14px;margin-top:14px}
@media(min-width:760px){.daydet{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
.daydet .big{font-size:28px;font-weight:700}
.daydet .comps{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
/* track */
.trk{display:grid;gap:14px}
@media(min-width:900px){.trk{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}.trk>.card:last-child{display:flex;flex-direction:column}.trk>.card:last-child .fig{flex:1;min-height:280px;height:auto!important}}
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end}
@media(max-width:520px){.form{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.form .btn{grid-column:1/-1}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpis div{background:var(--bg);border-radius:14px;padding:10px 12px}
.kpis b{display:block;font-size:clamp(16px,calc(8px + 1vw),22px);font-weight:700;line-height:1.25;text-wrap:balance}
.kpis span{font-size:13px;color:var(--ink3)}
.exnote{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;background:var(--chipC);color:var(--chipCt);border-radius:14px;padding:8px 8px 8px 14px;font-size:14px;font-weight:600;margin-top:12px}
.exnote .btn{min-height:36px;padding:4px 14px;font-size:14px}
.log{list-style:none;margin:12px 0 0;padding:0}
.log li{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--sep)}
.log li b{white-space:nowrap}
.log .del{width:44px;height:44px;border-radius:12px;border:0;background:transparent;cursor:pointer;color:var(--ink3)}
.log .del:hover{background:var(--sep);color:var(--redT)}
.empty{color:var(--ink3);padding:16px 0}
/* gear */
.gear h3.gh3{font-size:15px;font-weight:700;margin:6px 0 12px;color:var(--ink2)}
.gc .tag{font-size:13px;font-weight:700}
.gc h3{margin:4px 0 8px}
.gc p{color:var(--ink2);font-size:15px}
.gc a{display:inline-block;margin-top:10px;font-weight:650;font-size:14px}
.cav{display:grid;grid-template-columns:120px minmax(0,1fr);gap:20px;align-items:center;margin-top:14px}
.cav p{color:var(--ink2)}
@media(max-width:520px){.cav{grid-template-columns:minmax(0,1fr)}.cav svg{max-width:120px}}
/* sources */
.src{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px;counter-reset:s}
@media(max-width:700px){.src{grid-template-columns:minmax(0,1fr)}}
.src li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);padding:10px 0;border-top:1px solid var(--sep)}
.src li::before{content:counter(s);font-weight:700;color:var(--greenT);font-size:14px}
.src a{font-weight:650;color:var(--ink);text-decoration:none}
.src a:hover{text-decoration:underline}
.src span{display:block;font-size:13.5px;color:var(--ink3)}
.disc{margin-top:24px;color:var(--ink3);font-size:14px}
footer{border-top:1px solid var(--sep);padding-block:28px 40px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
footer p{color:var(--ink3);font-size:14px}
/* dialogs, pill, toast */
dialog{border:0;padding:0;background:transparent;color:var(--ink);max-width:min(560px,calc(100vw - 24px));width:100%;max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
.dlg{background:var(--card2);border:1px solid var(--rim);border-radius:28px;padding:20px;max-height:calc(100dvh - 24px);overflow:auto}
:root[data-theme=dark] .dlg{background:#141416}
dialog:has(.pill:not([hidden])) .dlg{padding-bottom:88px}
.dlg .hd{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.dlg .hd h3{font-size:22px}
.dlg .pic{width:132px;height:132px;flex:none}
.dlg .row{display:flex;gap:16px;align-items:center}
.setrow{display:grid;grid-template-columns:auto minmax(0,1fr) 44px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--sep)}
.setrow b{white-space:nowrap}
.dnav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.player{display:grid;justify-items:center;gap:10px;text-align:center}
.player .pic{width:150px;height:150px}
.timer{position:relative;width:180px;height:180px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
:root[dir=rtl] .timer svg{transform:rotate(-90deg) scaleY(-1)}
.timer output{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.side{font-weight:700;color:var(--redT);min-height:1.5em}
.pbar{display:flex;gap:4px;width:100%}
.pbar i{flex:1;height:6px;border-radius:3px;background:var(--trackR)}
.pbar i.on{background:var(--red)}
.ctrls{display:flex;gap:10px;justify-content:center;align-items:center}
.ctrls .btn.big{width:64px;height:64px;padding:0}
.ctrls .btn.big svg{width:26px;height:26px}
.pill{position:fixed;z-index:60;inset-inline:0;bottom:max(16px,env(safe-area-inset-bottom,0px));margin:0 auto;width:max-content;max-width:calc(100vw - 24px);display:flex;align-items:center;gap:8px;padding:8px;border-radius:999px;background:var(--ink);color:var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.pill[hidden]{display:none}
.pill .ring{width:40px;height:40px}
.pill output{font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;min-width:56px;text-align:center}
.pill button{min-height:40px;min-width:44px;border-radius:999px;border:0;background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg);font-weight:700;cursor:pointer;padding:0 12px}
.pill .lbl{font-weight:700;font-size:14px;padding-inline:4px}
@media(max-width:420px){.pill .lbl{display:none}}
.toast{position:fixed;z-index:70;inset-inline:0;top:74px;margin:0 auto;width:max-content;max-width:calc(100vw - 24px);display:flex;gap:12px;align-items:center;padding:10px 12px 10px 16px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:650;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
.toast button{min-height:36px;border-radius:10px;border:0;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);font-weight:700;padding:0 12px;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

"title":"Active recovery","sub":"10-min stretch · longer walk","steps":"10–12k","rings":[1,0.4,1]},{"d":"Sun","title":"Complete rest","sub":"Relax, steps still count","steps":"8–10k","rings":[0.85,0,0]}],"glyph":{"moon":"<path d=\"M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z\"/>","scale":"<rect x=\"3.5\" y=\"3.5\" width=\"17\" height=\"17\" rx=\"4\"/><path d=\"M8 9a5 5 0 0 1 8 0\"/><path d=\"M12 9l1.5-2\"/>","tape":"<rect x=\"2.5\" y=\"8.5\" width=\"19\" height=\"8\" rx=\"2\"/><path d=\"M6 8.5v3M9 8.5v2M12 8.5v3M15 8.5v2M18 8.5v3\"/>","log":"<rect x=\"5\" y=\"3.5\" width=\"14\" height=\"17\" rx=\"2.5\"/><path d=\"M9 8h6M9 12h6M9 16h4\"/>","shoe":"<path d=\"M3 16.5V9.5l3 1 3-3.5 3 4.5c2.5 1 6 1.5 8 3.5v2z\"/><path d=\"M3 19.5h18\"/>","watch":"<rect x=\"6\" y=\"6\" width=\"12\" height=\"12\" rx=\"3.5\"/><path d=\"M9 6V2.8h6V6M9 18v3.2h6V18\"/><path d=\"M12 9.5V12l1.6 1.2\"/>","clock":"<circle cx=\"12\" cy=\"12\" r=\"8.5\"/><path d=\"M12 7.5V12l3 2\"/>","foot":"<path d=\"M6.5 13.5c-1-4 .5-9 3.5-9s3 4 2 7-1 6-3 6-2-2-2.5-4z\"/><path d=\"M16 21c-2 0-2.5-2-2.5-3.5 0-2.5 1-4 3-4s2.5 2 2 4-1 3.5-2.5 3.5z\"/>"},"walk":"<svg xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 120 120\"><polyline points=\"36,106 46,86 56,64 68,84 74,106 84,106\" fill=\"none\" stroke=\"var(--ic-fg)\" stroke-width=\"11\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polyline points=\"56,64 58,32\" fill=\"none\" stroke=\"var(--ic-fg)\" stroke-width=\"14\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"60\" cy=\"18\" r=\"12.0\" fill=\"var(--ic-ko)\"/><circle cx=\"60\" cy=\"18\" r=\"9.5\" fill=\"var(--ic-fg)\"/><polyline points=\"58,36 48,52 44,66\" fill=\"none\" stroke=\"var(--ic-ko)\" stroke-width=\"13\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polyline points=\"58,36 48,52 44,66\" fill=\"none\" stroke=\"var(--ic-fg)\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polyline points=\"58,36 68,52 78,48\" fill=\"none\" stroke=\"var(--ic-ko)\" stroke-width=\"13\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polyline points=\"58,36 68,52 78,48\" fill=\"none\" stroke=\"var(--ic-fg)\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>","C":{"en":{"hero":{"kicker":"6-month program","sub":"Dumbbells · Walking · Mobility","h1a":"Lose the fat.","h1b":"Keep the muscle.","lede":"Six dumbbell lifts, daily walking and ten minutes of mobility. A simple plan built on the research, with every claim linked to its source.","stats":[{"lab":"Goal","val":"−20 kg","sub":"105 → 85 kg","tone":"red"},{"lab":"Strength","val":"3×","sub":"Mon · Wed · Fri","tone":"green"},{"lab":"Steps","val":"10k","sub":"every single day","tone":"cyan"},{"lab":"Protein","val":"170 g","sub":"160–180 g / day","tone":"ink"}]},"plan":{"title":"Your plan.<br>The rules that run it.","lede":"Lift three times a week, walk every day, eat plenty of protein and lose weight at a pace that keeps your muscle. That is the whole plan.","big":"−20 kg","when":"In about 5–6 months","head":"The rules","rules":["<strong>Strength 3×/week, full body. <\/strong>Six dumbbell lifts on Mon, Wed and Fri. Beats the WHO minimum of muscle-strengthening on 2+ days a week.  <a href=\"https://www.who.int/initiatives/behealthy/physical-activity\" target=\"_blank\" rel=\"noopener\" class=\"ext\">WHO<\/a>","<strong>Protein 160–180 g/day. <\/strong>That is ≈1.5–1.7 g/kg at 105 kg, inside the ISSN range of 1.4–2.0 g/kg for building and keeping muscle.  <a href=\"https://pubmed.ncbi.nlm.nih.gov/28642676/\" target=\"_blank\" rel=\"noopener\" class=\"ext\">ISSN<\/a>","<strong>Pace. <\/strong>About 5 kg in month 1 (partly water), then 3–4 kg a month. That stays inside the 0.5–1% of body weight a week that protects muscle, so 85 kg lands around month 5–6.  <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC4033492\" target=\"_blank\" rel=\"noopener\" class=\"ext\">Helms 2014<\/a>","<strong>Deficit. <\/strong>About 1,280 kcal/day in month 1 (5 × 7,700 ÷ 30), easing to ≈900 kcal/day after. Never starve yourself.  <a href=\"https://www.niddk.nih.gov/health-information/weight-management/body-weight-planner\" target=\"_blank\" rel=\"noopener\" class=\"ext\">Planner<\/a>","<strong>Volume. <\/strong>3 sets per lift in weeks 1–3, then a 4th set on squats, rows and presses from week 4, for 10+ hard sets per muscle a week.  <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC9012799\" target=\"_blank\" rel=\"noopener\" class=\"ext\">Review<\/a>","<strong>Progression. <\/strong>When all sets hit 12 clean reps, add 2–2.5 kg and drop back to 8.","<strong>Warm-up and mobility. <\/strong>5 minutes of warm-up before every session and 10 minutes of stretching after (pages 05 and 06).","<strong>Steps. <\/strong>10,000 a day, split across the day. On a busy day, 7,000 is the floor.  <a href=\"https://pubmed.ncbi.nlm.nih.gov/40713949/\" target=\"_blank\" rel=\"noopener\" class=\"ext\">Lancet<\/a>","<strong>Recovery and tracking. <\/strong>Sleep 7–9 h. Weigh in 3–4 mornings a week and follow the weekly average. Use your watch for steps, heart rate and sleep, not calories.  <a href=\"https://med.stanford.edu/news/all-news/2017/05/fitness-trackers-accurately-measure-heart-rate-but-not-calories-burned.html\" target=\"_blank\" rel=\"noopener\" class=\"ext\">Stanford<\/a>"]},"numbers":{"title":"The math behind<br>the goal.","chart":"The road to 85 kg","chartSub":"Projected body weight by month","note":"Month 1 can be ~5 kg (water + fat). After that, <strong>3–4 kg/month<\/strong> keeps you inside 0.5–1% of body weight per week, the range linked to keeping muscle.","cards":[{"lab":"Deficit","val":"≈1,280","unit":"kcal / day","body":"For 5 kg in month 1 (5 × 7,700 ÷ 30). From month 2, 3–4 kg a month needs ≈900 kcal/day.<br><br><a href=\"https://www.niddk.nih.gov/health-information/weight-management/body-weight-planner\" target=\"_blank\" rel=\"noopener\" class=\"ext\">NIH Body Weight Planner<\/a>","tone":"red"},{"lab":"Protein","val":"160–180","unit":"grams / day","body":"Split into 4 meals of ~40 g. The ISSN suggests 20–40 g per serving, every 3–4 hours.<br><br><a href=\"https://pubmed.ncbi.nlm.nih.gov/28642676/\" target=\"_blank\" rel=\"noopener\" class=\"ext\">ISSN position stand<\/a>","tone":"green"},{"lab":"Steps","val":"10,000","unit":"≈ 7.5–8 km / day","body":"7,000/day already brings most of the health benefit (−47% mortality vs 2,000). The extra 3,000 is for fat burn.<br><br><a href=\"https://pubmed.ncbi.nlm.nih.gov/40713949/\" target=\"_blank\" rel=\"noopener\" class=\"ext\">Lancet Public Health 2025<\/a>","tone":"cyan"}],"tips":[["7,000 is your floor.","10,000 steps is about 7.5–8 km. On a busy day, 7,000 still brings most of the health benefit, so never let it drop below that."],["Judge the trend, not the day.","Weigh in 3–4 mornings a week (after the bathroom, before food) and compare weekly averages. Daily swings of 1–2 kg are just water."]]},"workout":{"title":"Six lifts.<br>Every muscle.","days":"Mon · Wed · Fri","mins":"≈40 min","rest":"90 s rest","legend":"Faded figure = start  ·  solid = finish","how":"How to do it","ex":[{"id":"goblet_squat","name":"Goblet Squat","targetsLab":"Targets","targets":"Quads · Glutes · Core","sets":"3 × 8–12","cue":"Hold one dumbbell upright at your chest. Sit down between your heels, knees tracking over toes, chest tall.","url":"https://acefitness.org/education-and-resources/lifestyle/exercise-library/362/goblet-squat"},{"id":"floor_press","name":"Dumbbell Floor Press","targetsLab":"Targets","targets":"Chest · Triceps · Front delts","sets":"3 × 8–12","cue":"Lie with knees bent. Lower until your upper arms touch the floor, elbows ~45° from your sides. A bench works too.","url":"https://www.bodybuilding.com/exercises/dumbbell-floor-press"},{"id":"single_arm_row","name":"Single-Arm Row","targetsLab":"Targets","targets":"Lats · Upper back · Biceps","sets":"3 × 8–12 / arm","cue":"One hand on a bench, back flat. Pull the dumbbell toward your hip, not your chest, then lower slowly.","url":"https://www.acefitness.org/exercise-library-details/3/126/"},{"id":"rdl","name":"Romanian Deadlift","targetsLab":"Targets","targets":"Hamstrings · Glutes · Lower back","sets":"3 × 10–12","cue":"Soft knees. Push your hips back and slide the weights down your thighs until the hamstrings stretch. Spine neutral.","url":"https://www.nasm.org/resource-center/exercise-library/dumbbell-romanian-deadlift"},{"id":"overhead_press","name":"Overhead Press","targetsLab":"Targets","targets":"Shoulders · Triceps","sets":"3 × 8–12","cue":"Seated or standing. Brace and squeeze your glutes, then press until your biceps pass your ears. No back arch.","url":"https://www.muscleandstrength.com/exercises/standing-dumbbell-press.html"},{"id":"farmers_carry","name":"Farmer’s Carry","targetsLab":"Targets","targets":"Core · Grip · Traps · Posture","sets":"3 × 45–60 s","cue":"Heaviest dumbbells you can hold. Shoulders down and back, walk tall and slow. Swap for a plank if space is tight.","url":"https://www.acefitness.org/education-and-resources/lifestyle/exercise-library/359/farmer-s-carry"}]},"session":{"title":"How to run<br>each workout.","timeline":"One session · ≈50 minutes","segs":[["Warm-up","5 min"],["Lifts","≈35 min"],["Stretch","10 min"]],"warmLab":"Warm-up","warmTitle":"5 minutes, every time","warm":[["2 min","brisk walk or march in place"],["10 ×","bodyweight squats"],["10 ×","arm circles, each direction"],["1 set","goblet squats at ~50% weight"]],"effortLab":"Effort","effortTitle":"Last 2 reps = genuinely hard","effort":"Stop each set with about 2 reps left in the tank. If form breaks down, the weight is too heavy. If 12 feels easy, it is too light.","shoes":"Lift barefoot or in flat shoes, not cushioned walkers.","progLab":"Progression","progTitle":"The only rule that matters","prog":"When all 3 sets reach <strong>12 clean reps<\/strong>, add <strong>2–2.5 kg<\/strong> and drop back to 8 reps. Repeat.<br><br>No heavier dumbbells? Slow the lowering phase to 3 seconds.","weeks":["W1","W2","W3","W4","W5","W6","W7"],"progLegend":"Reps per set · each colour = +2–2.5 kg","volLab":"Volume upgrade","volTitle":"From week 4, add a 4th set","vol":"On goblet squats, rows, floor press and overhead press. It lifts each muscle to 10+ hard sets a week, the volume that best protects muscle in a deficit.","w13":"Weeks 1–3","w4":"Week 4 →"},"recover":{"title":"Ten minutes.<br>Five stretches.","lede":"Right after every lifting session (optional on rest days). Hold each stretch, breathe slowly through your nose, and never push into pain. The highlight shows where you should feel it.","st":[{"id":"doorway_chest","name":"Doorway Chest Stretch","time":"45–60 s / side","feelLab":"Feel it in","feel":"Chest · Front shoulders","tip":"Forearm on the frame at shoulder height. Step through until your chest opens, with no shoulder pinching.","sides":true},{"id":"childs_pose","name":"Child’s Pose","time":"45–60 s","feelLab":"Feel it in","feel":"Lats · Upper back · Hips","tip":"Knees wide, hips back to your heels, arms long. Walk your hands a little left, then right.","sides":false},{"id":"worlds_greatest","name":"World’s Greatest Stretch","time":"≈60 s / side","feelLab":"Feel it in","feel":"Hip flexors · Hamstrings · Mid-back","tip":"Deep lunge, inside hand down, then rotate and reach the other arm to the ceiling. 5 slow reps a side.","sides":true},{"id":"seated_hamstring","name":"Seated Hamstring Stretch","time":"45–60 s","feelLab":"Feel it in","feel":"Hamstrings · Calves","tip":"Legs long. Hinge from the hips and lead with your chest, not your head. Relieves RDL tightness.","sides":false},{"id":"calf_stretch","name":"Standing Calf Stretch","time":"45–60 s / side","feelLab":"Feel it in","feel":"Calves · Achilles","tip":"Hands on the wall, back knee straight, back heel pressed down. Essential with 10k steps a day.","sides":true}],"sleep":{"name":"Sleep 7–9 hours","sub":"The recovery multiplier","chip":"Every night","helpsLab":"Helps","helps":"Everything above","body":"Short sleep makes a deficit harder: more hunger, weaker sessions, slower recovery. Same bedtime, dark cool room, screens off 30 min before."}},"week":{"title":"The week<br>at a glance.","legend":["Steps","Strength","Mobility"],"days":[{"d":"Mon","title":"Strength + stretch","sub":"Full-body dumbbells · 10-min mobility","steps":"10,000"},{"d":"Tue","title":"Rest","sub":"Optional 10-min stretch","steps":"10,000"},{"d":"Wed","title":"Strength + stretch","sub":"Full-body dumbbells · 10-min mobility","steps":"10,000"},{"d":"Thu","title":"Rest","sub":"Optional 10-min stretch","steps":"10,000"},{"d":"Fri","title":"Strength + stretch","sub":"Full-body dumbbells · 10-min mobility","steps":"10,000"},{"d":"Sat","title":"Active recovery","sub":"10-min stretch · longer walk","steps":"10–12k"},{"d":"Sun","title":"Complete rest","sub":"Relax, steps still count","steps":"8–10k"}],"tipTitle":"Split the steps. Don’t grind them out.","tip":"A 20-min morning walk + normal daily movement + a 30-min evening walk gets you to 10,000 without a single long session."},"gear":{"title":"Worth buying.<br>Worth skipping.","shoesHead":"Walking shoes · yes, buy a pair","watchHead":"Smartwatch for a Xiaomi phone · helpful, not essential","details":"Details","shoes":[{"tag":"Max cushion","name":"HOKA Clifton 11","body":"Plush, rockered ride with a soft, roomy upper. The most cushioned of the three.","url":"https://www.t3.com/active/running/hoka-clifton-11-launch-0726"},{"tag":"Wide fits","name":"Brooks Ghost 18","body":"Balanced DNA Loft v3 foam, sold in narrow to extra-wide fits.","url":"https://www.tomsguide.com/wellness/running/brooks-ghost-18-review"},{"tag":"Built for walking","name":"New Balance Fresh Foam X 840v1","body":"Extra-soft walking shoe for all-day wear, 4 mm drop, 2E/4E width options.","url":"https://www.newbalance.com/pd/fresh-foam-x-840v1/M840FCB-2E-10.html"}],"watches":[{"tag":"Best value","name":"Xiaomi Smart Band 10 Pro","body":"1.74″ AMOLED, up to 21 days (light use), built-in GNSS. Syncs with Mi Fitness.","url":"https://www.mi.com/global/product/xiaomi-smart-band-10-pro/"},{"tag":"Best all-rounder","name":"Redmi Watch 6","body":"2.07″ AMOLED, up to 24 days (light use), dual-antenna GNSS for phone-free walks.","url":"https://www.mi.com/global/product/redmi-watch-6/specs/"},{"tag":"Premium","name":"Xiaomi Watch S5 46mm","body":"316L stainless steel, dual-band GNSS, up to 21 days. Classic watch look.","url":"https://www.mi.com/global/product/xiaomi-watch-s5-46mm/"}],"cavTitle":"Trust the steps. Ignore the calories.","cav":"Stanford tested seven wrist trackers. Most measured heart rate within ~5%, but calories burned were off by <strong>27% at best and 93% at worst<\/strong>. Use your watch for steps, heart rate and sleep, never to “earn” food.<br><br><a href=\"https://med.stanford.edu/news/all-news/2017/05/fitness-trackers-accurately-measure-heart-rate-but-not-calories-burned.html\" target=\"_blank\" rel=\"noopener\" class=\"ext\">Stanford Medicine study<\/a>","cavFig":"calorie error"},"track":{"title":"Measure what<br>matters.","cards":[["Weight","3–4 mornings a week. Compare weekly averages."],["Waist","Every 2 weeks at the navel. Drops even when the scale stalls."],["Lifts","Log weight × reps each session. Rising numbers = muscle kept."]]},"sources":{"title":"Sources","lede":"Every claim in this guide links to one of these. Tap to open.","items":[{"title":"Physical activity recommendations for adults","meta":"WHO","url":"https://www.who.int/initiatives/behealthy/physical-activity"},{"title":"ISSN position stand: protein and exercise","meta":"Jäger et al. 2017 · JISSN","url":"https://pubmed.ncbi.nlm.nih.gov/28642676/"},{"title":"Natural bodybuilding contest prep: nutrition","meta":"Helms et al. 2014 · JISSN","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC4033492"},{"title":"Training volume & lean mass in a calorie deficit","meta":"Roth et al. 2022 · Eur J Appl Physi "url":"https://www.mi.com/global/product/redmi-watch-6/specs/"},{"title":"Watch S5 46mm","meta":"Xiaomi","url":"https://www.mi.com/global/product/xiaomi-watch-s5-46mm/"}],"disclaimer":"General fitness information, not medical advice. Check with a doctor before starting a large calorie deficit.","tagline":"Lose the fat · Keep the muscle"}},"ckb":{"hero":{"kicker":"پرۆگرامی 6 مانگی","sub":"دەمبڵ · ڕۆیشتن · نەرمی","h1a":"چەوری بتوێنەوە.","h1b":"ماسولکە بپارێزە.","lede":"شەش ڕاهێنانی دەمبڵ، ڕۆیشتنی ڕۆژانە و دە خولەک نەرمەڕاهێنان. پلانێکی سادە لەسەر بنەمای توێژینەوە، کە هەر زانیارییەک بە سەرچاوەکەیەوە بەستراوەتەوە.","stats":[{"lab":"ئامانج","val":"−20 کگم","sub":"105 ← 85 کگم","tone":"red"},{"lab":"هێز","val":"3×","sub":"دووشەممە · چوارشەممە · هەینی","tone":"green"},{"lab":"هەنگاو","val":"10 هەزار","sub":"هەموو ڕۆژێک","tone":"cyan"},{"lab":"پرۆتین","val":"170 گم","sub":"160–180 گم / ڕۆژ","tone":"ink"}]},"plan":{"title":"پلانەکەت.<br>یاساکانی بەڕێوەبردنی.","lede":"هەفتەی سێ جار ڕاهێنانی هێز بکە، هەموو ڕۆژێک بڕۆ، پرۆتینی پێویست بخۆ و بە خێراییەک کێش دابەزێنە کە ماسولکەکانت بپارێزێت. ئەمە تەواوی پلانەکەیە.","big":"−20 کگم","when":"لە ماوەی نزیکەی 5–6 مانگدا","head":"یاساکان","rules":["<strong>ڕاهێنانی هێز هەفتەی 3 جار، تەواوی جەستە. <\/strong>شەش جووڵەی دەمبڵ لە دووشەممە، چوارشەممە و هەینی. لە کەمترین پێشنیاری WHO زیاترە کە 2 ڕۆژ یان زیاترە لە هەفتەیەکدا.  <a href=\"https://www.who.int/initiatives/behealthy/physical-activity\" target=\"_blank\" rel=\"noopener\" class=\"ext\">WHO<\/a>","<strong>پرۆتین 160–180 گم/ڕۆژ. <\/strong>ئەمە دەکاتە ≈1.5–1.7 گم/کگم بۆ کێشی 105 کگم، لە ناو سنووری ISSN دا کە 1.4–2.0 گم/کگمە بۆ دروستکردن و پاراستنی ماسولکە.  <a href=\"https://pubmed.ncbi.nlm.nih.gov/28642676/\" target=\"_blank\" rel=\"noopener\" class=\"ext\">ISSN<\/a>","<strong>خێرایی. <\/strong>نزیکەی 5 کگم لە مانگی 1 (بەشێکی ئاوە)، پاشان 3–4 کگم لە مانگێکدا. ئەمە لە سنووری 0.5–1% ی کێشی جەستە لە هەفتەیەکدا دەمێنێتەوە کە ماسولکە دەپارێزێت، بەمەش لە مانگی 5–6 دەگەیتە 85 کگم.  <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC4033492\" target=\"_blank\" rel=\"noopener\" class=\"ext\">Helms 2014<\/a>","<strong>کەمیی کالۆری. <\/strong>نزیکەی 1,280 کالۆری/ڕۆژ لە مانگی 1 (5 × 7,700 ÷ 30)، پاشان کەم دەبێتەوە بۆ ≈900 کالۆری/ڕۆژ. هەرگیز خۆت برسی مەکە.  <a href=\"https://www.niddk.nih.gov/health-information/weight-management/body-weight-planner\" target=\"_blank\" rel=\"noopener\" class=\"ext\">پلاندانەر<\/a>","<strong>قەبارە. <\/strong>3 سێت بۆ هەر جووڵەیەک لە هەفتەکانی 1–3، پاشان سێتی چوارەم بۆ سکوات، ڕاکێشان و پرێس لە هەفتەی 4 ەوە، بۆ 10+ سێتی قورس بۆ هەر ماسولکەیەک لە هەفتەیەکدا.  <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC9012799\" target=\"_blank\" rel=\"noopener\" class=\"ext\">پێداچوونەوە<\/a>","<strong>پێشکەوتن. <\/strong>کاتێک هەموو سێتەکان دەگەنە 12 جاری ڕێک، 2–2.5 کگم زیاد بکە و بگەڕێوە سەر 8 جار.","<strong>گەرمکردن و نەرمی. <\/strong>5 خولەک گەرمکردن پێش هەر ڕاهێنانێک و 10 خولەک کشان لە دوای ڕاهێنان (لاپەڕەکانی 05 و 06).","<strong>هەنگاوەکان. <\/strong>10,000 هەنگاو لە ڕۆژێکدا، دابەشکراو بەسەر ڕۆژەکەدا. لە ڕۆژە سەرقاڵەکاندا، 7,000 کەمترین سنوورە.  <a href=\"https://pubmed.ncbi.nlm.nih.gov/40713949/\" target=\"_blank\" rel=\"noopener\" class=\"ext\">Lancet<\/a>","<strong>چاکبوونەوە و بەدواداچوون. <\/strong>7–9 کاتژمێر بخەوە. هەفتەی 3–4 بەیانی خۆت بکێشە و تێکڕای هەفتانە پەیڕەو بکە. کاتژمێرەکەت بۆ هەنگاو، لێدانی دڵ و خەو بەکاربهێنە نەک کالۆری.  <a href=\"https://med.stanford.edu/news/all-news/2017/05/fitness-trackers-accurately-measure-heart-rate-but-not-calories-burned.html\" target=\"_blank\" rel=\"noopener\" class=\"ext\">Stanford<\/a>"]},"numbers":{"title":"حیساباتی پشت<br>ئامانجەکە.","chart":"ڕێگای گەیشتن بە 85 کگم","chartSub":"کێشی پێشبینیکراوی جەستە بەپێی مانگ","note":"مانگی 1 دەکرێت ~5 کگم بێت (ئاو + چەوری). دوای ئەوە، <strong>3–4 کگم/مانگ<\/strong> لە سنووری 0.5–1% ی کێشی جەستە لە هەفتەیەکدا دەتهێڵێتەوە، کە باشترین مەودایە بۆ پاراستنی ماسولکە.","cards":[{"lab":"کەمیی کالۆری","val":"≈1,280","unit":"کالۆری / ڕۆژ","body":"بۆ 5 کگم لە مانگی 1 (5 × 7,700 ÷ 30). لە مانگی 2 ەوە، 3–4 کگم لە مانگێکدا پێویستی بە ≈900 کالۆری/ڕۆژ هەیە.<br><br><a href=\"https://www.niddk.nih.gov/health-information/weight-management/body-weight-planner\" target=\"_blank\" rel=\"noopener\" class=\"ext\">پلاندانەری کێشی جەستەی NIH<\/a>","tone":"red"},{"lab":"پرۆتین","val":"160–180","unit":"گرام / ڕۆژ","body":"دابەشی بکە بەسەر 4 ژەمی ~40 گم. ISSN پێشنیاری 20–40 گم دەکات بۆ هەر ژەمێک، هەر 3–4 کاتژمێر جارێک.<br><br><a href=\"https://pubmed.ncbi.nlm.nih.gov/28642676/\" target=\"_blank\" rel=\"noopener\" class=\"ext\">ڕاگەیەندراوی فەرمیی ISSN<\/a>","tone":"green"},{"lab":"هەنگاو","val":"10,000","unit":"≈ 7.5–8 کم / ڕۆژ","body":"7,000 هەنگاو/ڕۆژ پێشوەختە زۆربەی سوودە تەندروستییەکان دەبەخشێت (−47% مەترسیی مردن بەراورد بە 2,000). 3,000 ی زیادە بۆ سووتاندنی چەورییە.<br><br><a href=\"https://pubmed.ncbi.nlm.nih.gov/40713949/\" target=\"_blank\" rel=\"noopener\" class=\"ext\">Lancet Public Health 2025<\/a>","tone":"cyan"}],"tips":[["7,000 کەمترین سنوورتە.","10,000 هەنگاو نزیکەی 7.5–8 کمە. لە ڕۆژێکی سەرقاڵدا، 7,000 هێشتا زۆربەی سوودە تەندروستییەکان دەبەخشێت، بۆیە هەرگیز لەوە کەمتر مەکە."],["بڕیار لەسەر ئاراستەکە بدە، نەک ڕۆژەکە.","هەفتەی 3–4 بەیانی خۆت بکێشە (دوای تەوالێت، پێش نان) و تێکڕای هەفتانە بەراورد بکە. گۆڕانی ڕۆژانەی 1–2 کگم تەنها ئاوە."]]},"workout":{"title":"شەش جووڵە.<br>هەموو ماسولکەیەک.","days":"دووشەممە · چوارشەممە · هەینی","mins":"≈40 خولەک","rest":"90 چرکە پشوو","legend":"وێنەی کاڵ = دەستپێک  ·  تۆخ = کۆتایی","how":"چۆنیەتیی ئەنجامدانی","ex":[{"id":"goblet_squat","name":"سکواتی گۆبلێت","targetsLab":"ئامانج","targets":"پێشەوەی ڕان · سمت · ناوەڕاست","sets":"3 × 8–12","cue":"دەمبڵێک بە ستوونی لای سنگت بگرە. لە نێوان پاژنەکانت دابنیشە، ئەژنۆکان بە ئاراستەی پەنجەی پێ، سنگت ڕێک.","url":"https://acefitness.org/education-and-resources/lifestyle/exercise-library/362/goblet-squat"},{"id":"floor_press","name":"پرێسی سەر زەوی بە دەمبڵ","targetsLab":"ئامانج","targets":"سنگ · پشتی قۆڵ · پێشەوەی شان","sets":"3 × 8–12","cue":"پاڵ بکە  if(t.dataset.seg){segLen=+t.dataset.seg;store.set('segLen',segLen);$$('[data-seg]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.seg===segLen)));$('#rtTotal').textContent=`${u('total')} ≈ ${Math.round(SEGS.length*segLen/60)} ${u('min')}`;return}
 if(t.dataset.day!=null){selDay=+t.dataset.day;$$('[data-day]').forEach(b=>{const on=+b.dataset.day===selDay;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1});dayPanel();return}
 if(t.id==='cReset'){K=Object.assign({},CALC0);store.del('calc');$('#cSw').value=K.sw;$('#cGw').value=K.gw;$('#cM1').value=K.m1;$('#cPace').value=K.pace;$('#cSd').value=K.sd;updCalc();return}
 if(t.dataset.del){const d=t.dataset.del,old=LOG.slice();LOG=LOG.filter(e=>e.d!==d);saveLog();updLog();toast(u('deleted'),()=>{LOG=old;saveLog();updLog()});const f=$('#logL .del')||$('#lKg');f&&f.focus();return}
 if(t.id==='clrEx'){const old=LOG.slice();LOG=[];LOGEX=false;saveLog();updLog();toast(u('deleted'),()=>{LOG=old;LOGEX=true;saveLog();updLog()});$('#lKg').focus();return}
 if(t.id==='moreBtn'){showAll=!showAll;updLog();$('#moreBtn').focus();return}
});
document.addEventListener('input',ev=>{const t=ev.target;
 if(t.id==='stepsIn'){const v=parseInt(t.value,10);S.steps=isNaN(v)?0:Math.max(0,Math.min(100000,v));saveDay();updToday();return}
 if(['cSw','cGw','cM1','cPace','cSd'].includes(t.id)){const m={cSw:'sw',cGw:'gw',cM1:'m1',cPace:'pace',cSd:'sd'}[t.id];K[m]=t.id==='cSd'?t.value:(t.value===''?NaN:+t.value);store.set('calc',K);updCalc();return}
 if(t.id==='exKg'){store.set('kg:'+D.ex[curEx].id,t.value);return}
 if(t.dataset.rep!=null){const e=D.ex[curEx];S.reps[e.id]=S.reps[e.id]||[];S.reps[e.id][+t.dataset.rep]=t.value===''?null:Math.max(0,Math.min(100,parseInt(t.value,10)||0));saveDay();return}});
document.addEventListener('change',ev=>{const t=ev.target;
 if(t.id==='autoRest'){autoRest=t.checked;store.set('autoRest',autoRest);return}
 if(t.dataset.warm!=null){S.warm[+t.dataset.warm]=t.checked;saveDay();return}
 if(t.id==='stepsIn'){t.value=S.steps||''}});
document.addEventListener('submit',ev=>{if(ev.target.id==='calcF'){ev.preventDefault();return}
 if(ev.target.id!=='logF')return;ev.preventDefault();const d=$('#lDate').value,kg=parseFloat($('#lKg').value);
 if(!d){$('#lErr').textContent=u('badDate');$('#lDate').focus();return}if(!(kg>=30&&kg<=300)){$('#lErr').textContent=u('badKg');$('#lKg').focus();return}
 $('#lErr').textContent='';if(LOGEX){LOG=[];LOGEX=false}const ex=LOG.find(e=>e.d===d);if(ex)ex.kg=Math.round(kg*10)/10;else LOG.push({d,kg:Math.round(kg*10)/10});saveLog();updLog();toast(ex?u('updated'):u('saved'));$('#lKg').value=''});
document.addEventListener('keydown',ev=>{
 if(ev.key==='Escape'&&$('#menu').classList.contains('open')){setMenu(false);$('#menuBtn').focus()}
 const tb=ev.target.closest&&ev.target.closest('[data-day]');if(tb&&['ArrowLeft','ArrowRight','Home','End'].includes(ev.key)){ev.preventDefault();let i=+tb.dataset.day;const fwd=(ev.key==='ArrowRight')!==isRTL();i=ev.key==='Home'?0:ev.key==='End'?6:(i+(fwd?1:-1)+7)%7;$(`[data-day="${i}"]`).click();$(`[data-day="${i}"]`).focus()}
 if(ev.key===' '&&$('#rtDlg').open&&!ev.target.closest('button,input')){ev.preventDefault();rtCmd('toggle')}});
for(const d of ['#exDlg','#rtDlg']){const n=$(d);n.addEventListener('close',()=>{document.body.append($('#pill'),$('#toast'));document.body.style.overflow='';if(d==='#rtDlg'){RT.run=false;clearInterval(RT.id)}});n.addEventListener('click',ev=>{if(ev.target===n)closeDlg(n)})}
document.addEventListener('click',ev=>{if($('#menu').classList.contains('open')&&!ev.composedPath().some(n=>n.classList&&n.classList.contains('nav')))setMenu(false)});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>themeIcon());
const savedTheme=store.get('theme',null);if(savedTheme==='dark'||savedTheme==='light')root.dataset.theme=savedTheme;
renderAll();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tickRest();if(RT.run)tickRT()}});

/* ---------- motion: rim light follows the pointer; reveals on scroll; nav progress; hero drift ---------- */
(()=>{const RM=matchMedia('(prefers-reduced-motion:reduce)'),FINE=matchMedia('(hover:hover) and (pointer:fine)');
 let lit=null;
 function aim(c,x,y){const r=c.getBoundingClientRect(),px=x-r.left,py=y-r.top;c.style.setProperty('--mx',px+'px');c.style.setProperty('--my',py+'px');
  if(c.classList.contains('tilt')&&!RM.matches){const nx=px/r.width-.5,ny=py/r.height-.5;c.style.setProperty('--ry',(nx*5).toFixed(2)+'deg');c.style.setProperty('--rx',(-ny*5).toFixed(2)+'deg')}}
 function off(c){if(!c)return;c.classList.remove('lit');c.style.removeProperty('--rx');c.style.removeProperty('--ry')}
 document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const c=e.target.closest&&e.target.closest('#main .card');
  if(c!==lit){off(lit);lit=c;if(c){c.classList.toggle('tilt',c.offsetWidth<520);c.classList.add('lit')}}
  if(c)aim(c,e.clientX,e.clientY)},{passive:true});
 document.addEventListener('pointerleave',()=>{off(lit);lit=null});
 document.addEventListener('scroll',()=>{if(lit&&!lit.matches(':hover')){off(lit);lit=null}},{passive:true});
 /* touch: a brief glint where the finger lands */
 document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;const c=e.target.closest&&e.target.closest('#main .card');if(!c)return;
  aim(c,e.clientX,e.clientY);c.classList.add('lit');clearTimeout(c._t);c._t=setTimeout(()=>c.classList.remove('lit'),650)},{passive:true});
 /* reveals */
 let rio,first=true;
 window.motionReveal=()=>{if(rio)rio.disconnect();
  const els=$$('#main .band h2,#main .band .kick,#main .band .lede,#main .card,#main .legend');
  if(RM.matches){return}
  rio=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){e.target.classList.add('in');rio.unobserve(e.target)}},{rootMargin:'0px 0px -8% 0px',threshold:.06});
  const vh=innerHeight;
  els.forEach(el=>{const top=el.getBoundingClientRect().top;
   if(!first&&top<vh){el.classList.add('rv','in','now');requestAnimationFrame(()=>el.classList.remove('now'));return}
   const sib=el.parentElement?[...el.parentElement.children].filter(n=>n.classList&&n.classList.contains('card')):[];const i=Math.max(0,sib.indexOf(el));
   el.style.setProperty('--d',Math.min(i,5)*70+'ms');el.classList.add('rv');rio.observe(el)});
  first=false};
 /* nav progress + hero drift */
 const nav=$('.nav');if(nav&&!$('.prog',nav)){const p=document.createElement('div');p.className='prog';p.setAttribute('aria-hidden','true');nav.appendChild(p)}
 let tk=false;function frame(){tk=false;const y=scrollY,max=document.documentElement.scrollHeight-innerHeight;
  nav&&nav.classList.toggle('scrolled',y>8);nav&&nav.style.setProperty('--p',max>0?(y/max).toFixed(4):0);
  const h=$('#today .hero>div:first-child');if(h&&!RM.matches){if(y<900){h.style.transform=`translateY(${(y*.12).toFixed(1)}px)`;h.style.opacity=Math.max(.25,1-y/1100).toFixed(3)}}}
 addEventListener('scroll',()=>{if(!tk){tk=true;requestAnimationFrame(frame)}},{passive:true});addEventListener('resize',frame,{passive:true});
 window.motionFrame=frame;
 /* swipe between exercises inside the log sheet */
 let sx=0,sy=0,st=0;const xb=$('#exBody');
 xb.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});
 xb.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Date.now()-st>700||Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx)*.6)return;
  if(e.target.closest('input,select,textarea'))return;let dir=dx<0?1:-1;if(isRTL())dir=-dir;const b=$(`[data-exnav="${dir}"]`,xb);if(b&&!b.disabled){buzz(8);b.click()}},{passive:true});
 requestAnimationFrame(()=>{motionReveal();frame()});
})();
}
</script>
</body>
